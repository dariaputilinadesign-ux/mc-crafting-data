name: Update tutorials

# Refreshes tutorials.json daily from YouTube RSS so the app's Build Ideas
# library stays up to date automatically. Also runnable manually.
on:
  schedule:
    - cron: '0 6 * * *'   # every day at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild tutorials.json
        run: node tools/build-tutorials.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tutorials.json
          git diff --cached --quiet || git commit -m "Auto-update tutorials ($(date -u +%Y-%m-%d))"
          git push
